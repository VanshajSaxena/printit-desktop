name: Build & Publish to R2

on:
  push:
    branches:
      - master
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Enable Corepack & Install Yarn v4
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Configure AWS Credentials for Private R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Download private runtime dependency
        shell: pwsh
        run: |
          aws s3 cp s3://${{ secrets.PRIVATE_R2_BUCKET_NAME }}/print-service/${{ env.PRINT_SERVICE_VERSION }}/PrintService.7z ./buildResources/PrintService.7z --endpoint-url ${{ secrets.PRIVATE_R2_ENDPOINT }} --only-show-errors

      - name: Extract runtime dependency
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x ./buildResources/PrintService.7z -o./buildResources/ -aoa
          Remove-Item ./buildResources/PrintService.7z

      - name: Verify dependency exists
        shell: pwsh
        run: |
          if (!(Test-Path "./buildResources/PrintService.exe")) {
            Write-Error "Dependency extraction failed!"
            exit 1
          }

      - name: Build Workspaces
        run: yarn workspaces foreach --all --topological-dev run build
        env:
          VITE_DISTRIBUTION_CHANNEL: ${{ github.ref_name }}

      - name: Compile Electron App
        run: yarn electron-builder build --config electron-builder.cjs
        env:
          VITE_DISTRIBUTION_CHANNEL: ${{ github.ref_name }}

      - name: Configure AWS Credentials for Public Updates R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Sync artifacts to R2
        run: |
          aws s3 sync ./dist s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.ref_name }}/ --delete --endpoint-url ${{ secrets.R2_ENDPOINT }}
