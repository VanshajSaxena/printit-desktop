name: Build & Publish to R2

on:
  push:
    branches:
      - master
      - stable
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      PRINT_SERVICE_VERSION: v1.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download private runtime dependency
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # Dummy value required by AWS CLI
        run: |
          aws s3 cp `
            s3://${{ secrets.PRIVATE_R2_BUCKET_NAME }}/print-service/${{ env.PRINT_SERVICE_VERSION }}/PrintService.7z `
            ./buildResources/PrintService.7z `
            --endpoint-url ${{ secrets.PRIVATE_R2_ENDPOINT }} `
            --only-show-errors

      - name: Extract runtime dependency
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x `
            "./buildResources/PrintService.7z" `
            "-o./buildResources/" `
            -y
          Remove-Item ./buildResources/PrintService.7z

      - name: Verify dependency exists
        shell: pwsh
        run: |
          if (!(Test-Path "./buildResources/PrintService.exe")) {
            Write-Error "Dependency extraction failed!"
            exit 1
          }

      - name: Build Workspaces
        run: yarn workspaces foreach --all --topological-dev run build
        env:
          VITE_DISTRIBUTION_CHANNEL: ${{ github.ref_name }}

      - name: Compile Electron App
        run: yarn electron-builder build --config electron-builder.cjs
        env:
          VITE_DISTRIBUTION_CHANNEL: ${{ github.ref_name }}

      - name: Sync artifacts to R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1 # Dummy value required by AWS CLI
        run: |
          aws s3 sync `
            ./dist `
            s3://${{ secrets.R2_BUCKET_NAME }}/${{ github.ref_name }}/ `
            --delete `
            --endpoint-url ${{ secrets.R2_ENDPOINT }}
